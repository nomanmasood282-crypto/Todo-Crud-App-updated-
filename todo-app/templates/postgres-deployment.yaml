apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-postgres
  labels:
    app: todo-app-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app-postgres
  template:
    metadata:
      labels:
        app: todo-app-postgres
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.postgres.service.port }}
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-postgres" (include "todo-app.fullname" .) | quote }}
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-postgres" (include "todo-app.fullname" .) | quote }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-postgres" (include "todo-app.fullname" .) | quote }}
                  key: POSTGRES_PASSWORD
            {{- if .Values.postgres.pgdata }}
            # Only set on AKS: an Azure Disk has a lost+found folder at its root, and
            # Postgres refuses to start in a non-empty directory. A sub-folder avoids it.
            - name: PGDATA
              value: {{ .Values.postgres.pgdata | quote }}
            {{- end }}
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: todo-app-postgres