apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: todo-app-alerts
  namespace: monitoring
  labels:
    release: monitoring   # must match the Helm release name so Prometheus picks it up
spec:
  groups:
    - name: pod-health
      rules:
        - alert: PodNotRunning
          expr: kube_pod_status_phase{phase!="Running", phase!="Succeeded", namespace="todo-gitops"} > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is not running"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been in {{ $labels.phase }} state for more than 2 minutes."

        - alert: PodRestartingTooMuch
          expr: increase(kube_pod_container_status_restarts_total{namespace="todo-gitops"}[1h]) > 5
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} is restarting too often"
            description: "Pod {{ $labels.pod }} has restarted more than 5 times in the last 1 hour."

    - name: resource-usage
      rules:
        - alert: HighMemoryUsage
          expr: (sum(container_memory_working_set_bytes{namespace="todo-gitops", container!=""}) by (pod) / sum(kube_pod_container_resource_limits{resource="memory", namespace="todo-gitops"} ) by (pod)) * 100 > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage on pod {{ $labels.pod }}"
            description: "Pod {{ $labels.pod }} memory usage is above 80% for more than 5 minutes."

        - alert: HighCPUUsage
          expr: (sum(rate(container_cpu_usage_seconds_total{namespace="todo-gitops", container!=""}[5m])) by (pod) / sum(kube_pod_container_resource_limits{resource="cpu", namespace="todo-gitops"}) by (pod)) * 100 > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage on pod {{ $labels.pod }}"
            description: "Pod {{ $labels.pod }} CPU usage is above 80% for more than 5 minutes."

    - name: deployment-health
      rules:
        - alert: DeploymentReplicasMismatch
          expr: kube_deployment_spec_replicas{namespace="todo-gitops"} != kube_deployment_status_available_replicas{namespace="todo-gitops"}
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Deployment {{ $labels.deployment }} has unavailable replicas"
            description: "Deployment {{ $labels.deployment }} desired replicas do not match available replicas for more than 3 minutes."
