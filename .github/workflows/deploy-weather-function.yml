# Deploys the Azure Weather Function whenever code inside function-app/ changes.
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   AZURE_CREDENTIALS  — JSON output of:
#     az ad sp create-for-rbac --name "github-deploy" --role contributor \
#       --scopes /subscriptions/<your-subscription-id> --sdk-auth

name: Deploy Weather Function to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'terraform-azure-weather/function-app/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: terraform-azure-weather/function-app

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: func-islamabad-weather
          package: terraform-azure-weather/function-app
          scm-do-build-during-deployment: true
